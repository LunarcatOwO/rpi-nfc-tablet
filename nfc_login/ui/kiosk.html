<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Team Sign In</title>
<style>
/* Laid out for the 7 inch 1024x600 touchscreen. Everything is a finger-sized button.
   Look: deep navy, one bright blue, thin slate lines, pill buttons, hatched strips down the edges.
   Roboto and Roboto Mono are bundled in ui/fonts (SIL OFL, see fonts/OFL.txt) so it works offline. */
@font-face { font-family: "Roboto"; font-weight: 400 700; font-display: block; src: url(/fonts/roboto-latin-ext.woff2) format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Roboto"; font-weight: 400 700; font-display: block; src: url(/fonts/roboto-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Roboto Mono"; font-weight: 400 700; font-display: block; src: url(/fonts/roboto-mono-latin-ext.woff2) format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Roboto Mono"; font-weight: 400 700; font-display: block; src: url(/fonts/roboto-mono-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
:root {
  --bg: #020617; --bar: #020617; --panel: #0b1222; --raised: #0f172a; --key: #1e293b;
  --line: #1e293b; --line2: #334155; --text: #f8fafc; --soft: #cbd5e1; --muted: #94a3b8; --dim: #475569;
  --info: #52a9ff; --success: #4ade80; --warning: #fbbf24; --error: #ff6467; --prompt: #a78bfa;
  --accent: var(--info);
  --ease: cubic-bezier(.2, .7, .2, 1);
  --sans: Roboto, "Noto Sans", "DejaVu Sans", system-ui, sans-serif;
  --mono: "Roboto Mono", "DejaVu Sans Mono", monospace;
  --hatch: repeating-linear-gradient(45deg, transparent 0 6px, rgba(51,65,85,.55) 6px 7px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: var(--sans); overflow: hidden; user-select: none; -webkit-user-select: none;
  -webkit-font-smoothing: antialiased; touch-action: manipulation; }
body { display: flex; flex-direction: column; animation: fade .4s var(--ease);
  background: radial-gradient(700px 380px at 100% 100%, rgba(15,48,88,.7), transparent 70%) var(--bg); }
/* hatched strips down both edges, under the top bar */
body::before, body::after { content: ""; position: fixed; top: 64px; bottom: 0; width: 12px; background: var(--hatch);
  pointer-events: none; z-index: 1; }
body::before { left: 0; border-right: 1px solid var(--line); }
body::after { right: 0; border-left: 1px solid var(--line); }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.92); } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
body.kiosk { cursor: none; }
button { font-family: var(--sans); color: inherit; cursor: inherit; -webkit-tap-highlight-color: transparent; }
svg { flex: none; }

/* ---- top bar: back arrow, title, season, update, clock, admin gear */
header { height: 64px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 16px 0 24px;
  background: rgba(2,6,23,.85); border-bottom: 1px solid var(--line); }
header.backable { padding-left: 12px; }
.ib { width: 48px; height: 48px; border-radius: 999px; border: 1px solid var(--line2); background: rgba(15,23,42,.7);
  display: grid; place-items: center; padding: 0; transition: transform .08s, background-color .12s; }
.ib:active, .press:active { transform: scale(.94); }
#back, #gear, #lock { display: none; }
header.backable #back, header.idle #gear, header.admin #lock { display: grid; }
header.admin #back { display: none; }
#lock { width: auto; padding: 0 18px; display: none; gap: 8px; font: 600 17px var(--sans); grid-auto-flow: column; }
.brand { flex: 1; min-width: 0; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* three squares: white, faded, and one in the screen's colour */
.brand .mark { width: 22px; height: 22px; flex: none; position: relative;
  background: linear-gradient(var(--text), var(--text)) 0 0 / 10px 10px no-repeat,
              linear-gradient(rgba(248,250,252,.3), rgba(248,250,252,.3)) 12px 0 / 10px 10px no-repeat; }
.brand .mark::after { content: ""; position: absolute; left: 12px; top: 12px; width: 10px; height: 10px;
  background: var(--accent); transition: background-color .35s var(--ease); }
header.backable .mark { display: none; }
.chip { font-size: 15px; color: var(--muted); padding: 7px 14px; border-radius: 999px; background: rgba(15,23,42,.6);
  border: 1px solid var(--line2); white-space: nowrap; }
header:not(.idle) .chip.season { display: none; }
.update { display: none; color: var(--info); border-color: rgba(82,169,255,.5); align-items: center; gap: 6px; }
.update.on { display: flex; animation: pop .35s var(--ease); }
.clock { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 0 6px; }

/* ---- the body: [side list] content [who's here | number pad] */
main { flex: 1; display: flex; min-height: 0; position: relative; margin: 0 13px; }
#rail { display: none; width: 240px; padding: 16px 12px; flex-direction: column; gap: 6px;
  border-right: 1px solid var(--line); flex: none; }
body.railed #rail { display: flex; }
#rail button { height: 60px; border: 1px solid transparent; border-radius: 12px; background: transparent; color: var(--muted);
  font: 600 19px var(--sans); display: flex; align-items: center; gap: 14px; padding: 0 16px; text-align: left; }
#rail button.on { background: var(--key); border-color: var(--line2); color: var(--text); }
#rail i { width: 4px; height: 22px; border-radius: 2px; opacity: .35; }
#rail button.on i { opacity: 1; }
#content { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; animation: rise .28s var(--ease); }
.scroll { overflow: hidden auto; overscroll-behavior: contain; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
p { margin: 0; }

/* hero: the start screen, "tap the new card", and busy screens */
.hero { align-items: center; justify-content: center; gap: 22px; padding: 24px; text-align: center; }
.ring { width: 180px; height: 180px; border-radius: 50%; display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  box-shadow: 0 0 0 18px color-mix(in srgb, var(--accent) 5%, transparent),
              0 0 0 40px color-mix(in srgb, var(--accent) 3%, transparent);
  animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 50% { box-shadow: 0 0 0 24px color-mix(in srgb, var(--accent) 6%, transparent),
                                       0 0 0 52px color-mix(in srgb, var(--accent) 2%, transparent); } }
.ring.small { width: 120px; height: 120px; animation: pop .4s var(--ease); box-shadow: none; }
.hero h1 { margin: 0; font-size: 44px; font-weight: 600; letter-spacing: -.015em; }
.hero p { font-size: 19px; color: var(--muted); max-width: 520px; line-height: 1.4; }
.hero .acts { margin-top: 8px; }
.bigclock { text-align: center; line-height: 1; }
.bigclock b { display: block; font-size: 72px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.bigclock span { display: block; font-size: 18px; color: var(--muted); margin-top: 8px; }
.eyebrow { font: 600 13px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--info); }
/* the start screen: left aligned, date over a big clock, then "Tap your card" */
.hero.idle { gap: 0; align-items: flex-start; text-align: left; padding: 24px 20px 24px 112px; }
.hero.idle .btn { padding: 0 22px; font-size: 18px; gap: 10px; }
.hero.idle .bigclock { text-align: left; display: flex; flex-direction: column-reverse; }
.hero.idle .bigclock b { font-size: 96px; margin: 10px 0 18px -4px; }
.hero.idle .bigclock span { font: 600 13px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--info); margin: 0; }
.hero.idle h1 { font-size: 40px; letter-spacing: -.02em; }
.hero.idle h1 em { font-style: normal; color: var(--info); }
.hero.idle p { margin-top: 10px; font-size: 18px; }
.hero.idle .acts { margin-top: 26px; }

/* result: welcome / goodbye / done / errors */
.result h1 { color: var(--accent); font-size: 46px; }
.result .ring.small { border-radius: 28px; background: color-mix(in srgb, var(--accent) 12%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent), 0 0 60px -10px var(--accent); }
.result p { color: var(--soft); font-size: 20px; }
/* stats share their borders, like a table */
.stats { display: flex; gap: 1px; width: 100%; max-width: 560px; background: var(--line); border: 1px solid var(--line);
  border-radius: 14px; overflow: hidden; }
.stat { flex: 1; background: var(--panel); padding: 14px 18px; text-align: left; }
.stat span { font-size: 14px; color: var(--muted); }
.stat b { display: block; font: 600 26px var(--mono); margin-top: 4px; letter-spacing: -.02em; }

/* page: a title's worth of text and buttons */
.page { padding: 20px 24px; gap: 14px; }
.page h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 14px; }
.text { font-size: 18px; line-height: 1.45; color: var(--soft); white-space: pre-wrap; overflow-wrap: anywhere; }
.text.gap { height: 6px; }
.text.mono { font-variant-numeric: tabular-nums; }
.err { color: #ffd5d5; background: linear-gradient(100deg, rgba(255,100,103,.2), rgba(255,100,103,.06)); border-radius: 12px;
  padding: 10px 14px; box-shadow: inset 0 0 0 1px rgba(255,100,103,.45); animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* buttons drawn from the screen's "K  label" lines */
.acts { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { height: 64px; padding: 0 28px; border: 0; border-radius: 999px; background: rgba(15,23,42,.8);
  box-shadow: inset 0 0 0 1px var(--line2);
  font: 600 20px var(--sans); display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  transition: transform .08s, filter .12s; }
.btn.primary { background: var(--go, var(--info)); color: #04111f; font-weight: 700;
  box-shadow: 0 10px 36px -12px var(--go, var(--info)); }
.btn.wide { flex: 1; }
/* menu items: one box, the items share thin borders */
.items { display: grid; gap: 1px; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); background: var(--line);
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden; flex: none; }
.items > :last-child:nth-child(odd) { grid-column: 1 / -1; }
.item { min-height: 62px; border: 0; background: var(--panel); font: 500 19px var(--sans);
  display: flex; align-items: center; gap: 14px; padding: 8px 18px; text-align: left;
  transition: background-color .12s; }
.item:active { background: var(--key); }
.item span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item small { display: block; font-size: 14px; font-weight: 400; color: var(--muted); margin-top: 3px; }
.item .ii { flex: none; width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center;
  background: linear-gradient(140deg, color-mix(in srgb, var(--ic) 22%, transparent), color-mix(in srgb, var(--ic) 5%, transparent));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }

/* admin home: three tiles */
.tiles { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; margin: 24px;
  background: var(--line); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.tile { border: 0; background: var(--panel); display: flex; flex-direction: column;
  align-items: flex-start; gap: 10px; padding: 24px; text-align: left; transition: background-color .12s; }
.tile:active { background: var(--key); }
.tile .ic { width: 60px; height: 60px; border-radius: 14px; display: grid; place-items: center; margin-bottom: auto;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.tile b { font-size: 26px; font-weight: 600; }
.tile span { font-size: 16px; color: var(--muted); line-height: 1.4; }
.tile .pill { color: var(--info); border: 1px solid rgba(82,169,255,.45); padding: 4px 10px; border-radius: 999px; font-size: 14px; }

/* team cards (an old card's first scan, adding a person, changing teams) */
.teams { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 14px; }
.team { border: 0; border-radius: 14px; background: var(--panel); font: 600 22px var(--sans); display: flex;
  flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 18px 20px;
  text-align: left; box-shadow: inset 0 0 0 1px var(--line); min-height: 110px; transition: transform .1s; }
.team:active { transform: scale(.97); }
.team small { display: block; font-size: 15px; font-weight: 500; color: var(--warning); }
.team.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--line2); border-radius: 999px; color: var(--muted);
  font-size: 19px; align-items: center; justify-content: center; text-align: center; }
.tl { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-weight: 700;
  color: #04111f; font-size: 20px; flex: none; }

/* typing an ID or PIN: the entry and team buttons, with the number pad beside */
.entry { background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 18px 24px;
  display: flex; align-items: center; gap: 18px; min-height: 96px; }
.entry .code { font: 600 54px var(--mono); letter-spacing: .08em; }
.entry .code u { text-decoration: none; color: var(--dim); }
.entry .note { font-size: 16px; color: var(--muted); line-height: 1.4; }
.dots { display: flex; gap: 18px; justify-content: center; }
.dots i { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--dim); transition: background-color .1s; }
.dots i.on { background: var(--text); box-shadow: none; animation: pop .15s; }
.pin { align-items: center; justify-content: center; text-align: center; gap: 22px; }
.lockic { width: 84px; height: 84px; border-radius: 20px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 14%, transparent); }
.tbtns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tbtn { height: 64px; border-radius: 999px; border: 1px solid var(--line2); background: var(--raised);
  font: 600 18px var(--sans); display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; }
.tbtn .tl { width: 18px; height: 18px; border-radius: 50%; }
.tbtn.on { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, transparent); }
.hint { font-size: 15px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
#pad { display: none; width: 360px; flex: none; margin: 20px 20px 20px 0; gap: 10px;
  grid-template: repeat(4, minmax(0, 1fr)) / repeat(3, minmax(0, 1fr)); }
body.padded #pad { display: grid; animation: pop .25s var(--ease); }
#pad button { border: 0; border-radius: 14px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line2); font: 500 30px var(--mono);
  display: grid; place-items: center; padding: 0; transition: transform .08s, background-color .1s; }
#pad button:active { background: var(--line2); transform: scale(.95); }
#pad .go { background: var(--go, var(--info)); color: #04111f; font: 700 22px var(--sans); box-shadow: none; }
#pad .go.off { visibility: hidden; }

/* typing a name or Wi-Fi password: the field, and a full keyboard along the bottom */
.field { height: 64px; border-radius: 14px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--info), 0 0 0 4px rgba(82,169,255,.12);
  display: flex; align-items: center; padding: 0 20px; font-size: 28px; font-weight: 600; white-space: pre; overflow: hidden; }
.field::after { content: ""; width: 2px; height: 32px; background: var(--info); margin-left: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#kbd { display: none; flex: none; position: relative; z-index: 2; padding: 12px 12px 14px; background: #050b1a; border-top: 1px solid var(--line);
  flex-direction: column; gap: 7px; }
body.typing #kbd { display: flex; animation: rise .25s var(--ease); }
#kbd div { display: flex; gap: 7px; }
#kbd button, #kbd span { flex: 2 1 0; min-width: 0; height: 58px; }
#kbd button { border: 0; border-radius: 10px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line2); font: 500 22px var(--sans); padding: 0;
  transition: transform .06s, background-color .1s; }
#kbd button:active { background: var(--line2); transform: scale(.94); }
#kbd button.word { font-size: 18px; }
#kbd button.done { background: var(--info); color: #04111f; box-shadow: none; }
#kbd button.on { background: var(--info); color: #04111f; box-shadow: none; }

/* the start screen's side panel: who's here / leaderboard */
#side { display: none; width: 390px; flex: none; margin: 14px 12px 14px 0; background: rgba(2,6,23,.6); border-radius: 14px;
  flex-direction: column; overflow: hidden; border: 1px solid var(--line); }
body.idle #side { display: flex; }
.tabs { display: flex; padding: 8px; gap: 6px; background: transparent; border-bottom: 1px solid var(--line); position: relative; }
.tabs button { flex: 1; height: 48px; border: 0; border-radius: 999px; background: transparent; color: var(--muted);
  font: 600 17px var(--sans); position: relative; z-index: 1; transition: color .25s; }
.tabs button.on { color: var(--text); }
.tabs .ink { position: absolute; left: 8px; top: 8px; width: calc(50% - 11px); height: 48px; border-radius: 999px;
  background: var(--key); box-shadow: inset 0 0 0 1px var(--line2); transition: transform .3s var(--ease); }
.tabs.board .ink { transform: translateX(calc(100% + 6px)); }
#list { flex: 1; min-height: 0; overflow: hidden auto; overflow-anchor: none; overscroll-behavior: contain; scrollbar-width: none; }
#list::-webkit-scrollbar { display: none; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.row.new { animation: arrive 1.8s var(--ease); }
@keyframes arrive { from { background: rgba(82,169,255,.25); } }
.av { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; font-weight: 700;
  font-size: 15px; color: #04111f; flex: none; }
.rank { width: 26px; text-align: right; color: var(--dim); font: 600 15px var(--mono); flex: none; }
.nm { flex: 1; min-width: 0; font-size: 17px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nm div { font: 400 13px var(--mono); color: var(--muted); margin-top: 1px; }
.tm { font: 500 15px var(--mono); color: var(--text); }
.empty { color: var(--muted); padding: 24px 16px; font-size: 16px; text-align: center; }

/* people as rows: the leaderboard screen and name searches */
.prow { display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: var(--panel);
  border: 0; text-align: left; font: inherit; color: inherit; min-height: 62px; }
button.prow { transition: background-color .12s; }
button.prow:active { background: var(--key); }
.prow .av { width: 40px; height: 40px; font-size: 17px; }
.prow .rank { width: 40px; font-size: 18px; }
.prow .rank.r1 { color: var(--info); font-size: 22px; } .prow .rank.r2 { color: var(--soft); font-size: 22px; } .prow .rank.r3 { color: var(--muted); font-size: 22px; }
.prow .nm { font-size: 19px; }
.prow .nm div { font-size: 13px; }
.prow .tm { font-size: 17px; }
/* people lists: one box, rows share thin borders */
.prows { display: grid; gap: 1px; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); background: var(--line);
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.prows > :last-child:nth-child(odd) { grid-column: 1 / -1; }
.prows.compact .prow { min-height: 54px; padding: 6px 14px; }
.boardtop { display: flex; align-items: center; gap: 14px; }
.boardtop .text { flex: 1; color: var(--muted); }
.boardtop .btn { height: 52px; padding: 0 20px; font-size: 18px; }
.field.empty { color: var(--dim); font-weight: 500; }
.sidemore { display: none; margin: 8px; height: 48px; border: 1px solid var(--line2); border-radius: 999px; background: rgba(15,23,42,.7);
  font: 600 16px var(--sans); align-items: center; justify-content: center; gap: 8px; }
.tabs.board ~ .sidemore { display: flex; }

<script>
// The kiosk screen. Python (web_kiosk.py) decides everything; this page only draws
// the screens it pushes over /events and sends taps back as keys (see the key list
// at the top of nfc_login/kiosk/controller.py).
const $ = id => document.getElementById(id);
const TONES = ["info", "success", "warning", "error", "prompt"];
const BRAND = "Team Sign In";
let side = null;          // /api/kiosk: who's here, leaderboard, teams, settings
let shown = null;         // the screen showing
let kbMode = null, kbPage = "letters", kbShift = false;   // the letter keyboard

if (new URLSearchParams(location.search).has("kiosk")) document.body.classList.add("kiosk");

// Build an element: h("div.cls", {attrs}, ...children). Text children are safe (no HTML).
function h(tag, attrs, ...kids) {
  const [name, ...cls] = tag.split(".");
  const el = document.createElement(name);
  if (cls.length) el.className = cls.join(" ");
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "on") el.onclick = v;
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v);

  el.append(...kids.flat().filter(k => k !== null && k !== undefined && k !== false));
  return el;
}
// Inline icons (stroke SVG). Only our own fixed strings go through innerHTML.
const ICONS = {
  card: '<rect x="9" y="12" width="22" height="30" rx="3"/><path d="M15 36h10"/><path d="M34 16a10 10 0 0 1 0 14M38 12a16 16 0 0 1 0 22"/>',

// Team colours by letter (M mentors, U imported with no team yet).
const TEAM_COLORS = { A: "#52a9ff", B: "#fbbf24", C: "#4ade80", D: "#a78bfa", M: "#cbd5e1", U: "#64748b" };

  if (TEAM_COLORS[letter]) return TEAM_COLORS[letter];
  const i = side ? side.teams.findIndex(t => t.letter === letter) : -1;
  return SPARE[Math.max(i, 0) % SPARE.length];
}

  if (!side) return null;
  return side.teams.find(t => label.toLowerCase().startsWith(t.name.toLowerCase())) || null;

// Short wooden knocks from nfc_login/ui/sounds/ (made by scripts/make_sounds.py), played
// at full volume because the screen's speakers are weak. Loaded once, then played instantly.
const SOUNDS = ["sign_in", "sign_out", "success", "admin", "attention", "warning", "ignored", "error", "tap"];
let audio = null, buffers = {};
function loadSounds() {
  try {
    audio = new AudioContext();
    for (const name of SOUNDS)
      fetch(`/sounds/${name}.wav`).then(r => r.arrayBuffer()).then(b => audio.decodeAudioData(b))
        .then(buf => { buffers[name] = buf; }).catch(() => {});
  } catch (e) { /* no audio device: stay quiet */ }
}
function tone(name) {
  if (!audio || !buffers[name]) return;
  try {
    if (audio.state === "suspended") audio.resume();
    const src = audio.createBufferSource();
    src.buffer = buffers[name]; src.connect(audio.destination); src.start();
  } catch (e) { /* stay quiet */ }
}
loadSounds();
function playSound(name) { if (name && SOUNDS.includes(name) && (!side || side.sounds)) tone(name); }
function tapSound() { if (side && side.sounds && side.tap_sounds) tone("tap"); }

// ---------------------------------------------------------------- reading lines
// A line made only of "K  label" parts (K one key, two spaces, the label; parts three
// or more spaces apart) is buttons that send those keys. Anything else is text.
function keyParts(line) {
  const parts = [];
  for (const chunk of line.trim().split(/ {3,}/)) {
    const m = /^([0-9A-Z*#?~])  (\S.*)$/.exec(chunk);
    if (!m) return null;
    parts.push([m[1], m[2].trimEnd()]);
  }
  return parts;
}
// The top bar's back arrow does what a plain "*  back" button would, so those go.
const isPlainBack = ([key, label]) => key === "*" && /^back$/i.test(label);
// Lines grouped: {text}, {items: [[k, label]...]} (a run of numbered choices) or
// {acts: [[k, label]...]} (a row of buttons).
function blocks(lines) {
  const out = [];
  for (const line of lines) {
    const parts = keyParts(line);
    if (!parts) { out.push({ text: line }); continue; }
    const keep = parts.filter(p => !isPlainBack(p));
    if (!keep.length) continue;
    const last = out[out.length - 1];
    if (keep.length === 1 && /^[0-9]$/.test(keep[0][0])) {
      if (last && last.items) last.items.push(keep[0]); else out.push({ items: [keep[0]] });
    } else out.push({ acts: keep });
  }
  return out;
}
// "*" buttons go back (X), whatever has been typed; the rest send their key.
const keyFor = k => (k === "*" ? "X" : k);

function actButtons(parts, opts = {}) {
  return h("div.acts", {}, parts.map(([k, label]) => {
    const primary = !opts.plain && (k === "#" || k === "A");
    const b = h(`button.btn.press${primary ? ".primary" : ""}${opts.wide ? ".wide" : ""}`,
                { on: () => sendKey(keyFor(k)) }, keyIcon(k, opts), label);
    return b;
  }));
}
function keyIcon(k, opts) {
  const name = k === "#" ? opts.icon : { "~": "trophy", "?": "search" }[k];
  return name ? icon(name, 24) : null;
}
// Admin menu items get a coloured icon and a short line under the label, matched on
// the label's start. Anything not listed (seasons, Wi-Fi networks...) stays plain text.
const ITEM_LOOK = [
  // People
  ["Add a person", "useradd", "info", "Create an ID and name"],
  ["Enroll a card", "idcard", "success", "Link a card to someone"],
  ["Remove someone's cards", "cardx", "error", "Unlink lost cards"],
  ["Remove cards", "cardx", "error"],
  ["Change someone's team", "swap", "warning", "Gives them a new ID"],
  ["Change team", "swap", "warning"],
  ["Rename", "pen", "prompt", "Fix a name"],
  ["Deactivated people", "list", "muted", "See who is hidden"],
  ["Deactivate / reactivate", "ban", "muted", "Hide someone, keep their hours"],
  ["Deactivate", "ban", "muted"], ["Reactivate", "ban", "muted"],
  ["Delete", "trash", "error", "Erase them, their cards and hours"],
  ["Find someone by name", "search", "info", "Open a person's page"],
  // Hours
  ["Add / subtract hours", "plusminus", "success", "Fix someone's time"],
  ["Sign someone in or out", "inout", "info", "Without their card"],
  ["Sign in", "inout", "info"], ["Sign out", "outall", "info"],
  ["Who is here", "people", "success", "Everyone signed in now"],
  ["Sign everyone out", "outall", "warning", "Credits their time"],
  ["Start a new season", "flag", "error", "Hours back to zero, people stay"],
  ["Past seasons", "history", "prompt", "Rankings from old seasons"],
  ["Scheduled sign-out", "timer", "info", "Sign everyone out at set times"],
  ["Sign-in blocks", "calx", "warning", "Times when sign-in is closed"],
  // System
  ["System info", "info", "info", "Version, network, reader"],
  ["Check for updates", "reload", "success", "Look for a new version"],
  ["Install update", "download", "success", "Download it and restart"],
  ["Wi-Fi", "wifi", "info", "Pick a network"],
  ["Change the admin PIN", "key", "warning", "Set a new PIN"],
  ["Restart the kiosk app", "reload", "prompt", "Reload this screen"],
  ["Close the kiosk app", "closex", "muted", "Back to the desktop"],
  ["Restart the Pi", "power", "warning", "Reboot the whole tablet"],
  ["Shut down the Pi", "power", "error", "Safe to unplug after"],
  ["Minimize the kiosk app", "minimize", "muted", "Card scans keep counting"],
];
function itemLook(label) {
  return ITEM_LOOK.find(([start]) => label.startsWith(start));
}
function itemList(items, cols, subs = true) {
  return h("div.items", { style: `--cols: ${cols}` }, items.map(([k, label]) => {
    const look = itemLook(label);
    const color = look && `var(--${look[2]})`;
    return h("button.item", { on: () => sendKey(k) },
      look ? h("span.ii", { style: `--ic: ${color}` }, icon(look[1], 22, color, 3)) : null,
      h("span", {}, label, subs && look && look[3] ? h("small", {}, look[3]) : null),
      icon("chev", 20, "#64748b"));
  }));
}
function textP(line, cls = "") {
  return line.trim() ? h(`p.text${cls}`, {}, line) : h("p.text.gap");
}
// Text, items and buttons of a screen, in order.
function drawBlocks(lines, opts = {}) {
  return blocks(lines).map((b, i) => {
    if (b.text !== undefined) return textP(b.text, i === 0 && opts.error ? ".err" : (opts.mono ? ".mono" : ""));
    if (b.items) return itemList(b.items, b.items.length >= 5 ? 2 : 1);
    return actButtons(b.acts, opts);
  });
}
function statCards(stats) {
  if (!stats || !stats.length) return null;
  return h("div.stats", {}, stats.map(([label, value]) => h("div.stat", {}, h("span", {}, label), h("b", {}, value))));
}

// ---------------------------------------------------------------- screens
function setAccent(tone) {
  document.documentElement.style.setProperty("--accent", TONES.includes(tone) ? `var(--${tone})` : "var(--text)");
}
// The top bar for this screen: what the title says and which buttons it has.
function drawBar(s) {
  const bar = $("bar"), v = s.view;
  bar.className = "";
  let title = s.title;
  if (v === "idle" || v === "result") title = BRAND;
  else if (v === "admin") title = "Admin";
  else if (v === "menu") title = "Admin  ·  " + s.title;
  else if (v === "scan") title = "Admin";
  if (v === "idle") bar.classList.add("idle");
  else if (v === "admin") bar.classList.add("admin");
  else if (v !== "result" && !s.busy) bar.classList.add("backable");
  $("htitle").textContent = title;
}

function showScreen(s) {
  const fresh = !shown || shown.title !== s.title || shown.tone !== s.tone || shown.view !== s.view;
  shown = s;
  playSound(s.sound);
  setAccent(s.tone);
  const body = document.body;
  if (s.view === "dialog") {   // over whatever is showing; the bar stays as it is
    body.classList.add("boxed");
    $("veil").replaceChildren(drawDialog(s));
    holdBar(fresh ? s.hold : undefined);
    return;
  }
  body.classList.remove("boxed");
  drawBar(s);
  const mode = s.keyboard || null;
  body.classList.toggle("idle", s.view === "idle");
  body.classList.toggle("scanning", s.view === "scan");
  body.classList.toggle("railed", !!s.nav);
  body.classList.toggle("padded", mode === "id" || mode === "numpad");
  body.classList.toggle("typing", mode === "name" || mode === "text");
  if (mode !== kbMode) { kbMode = mode; kbPage = "letters"; kbShift = false; if (mode === "name" || mode === "text") drawKeys(); }
  document.querySelectorAll("#rail button").forEach(b => b.classList.toggle("on", b.dataset.nav === s.nav));
  if (mode === "id" || mode === "numpad") drawPad(s);
  const view = drawView(s);
  view.classList.add("view");
  if (!fresh) view.style.animation = "none";   // the same screen, updated: no slide
  $("content").replaceChildren(view);
  holdBar(fresh ? s.hold : undefined);
}

function drawView(s) {
  if (s.busy) return h("div.hero", {}, h("div.spinner", { style: "--size: 64px" }, ...Array(4).fill(0).map(() => h("i"))),
                       h("h1", {}, s.title), s.lines.map(l => textP(l)));
  switch (s.keyboard) {
    case "id": return drawId(s);
    case "numpad": return drawPin(s);
    case "name": case "text": return drawTyping(s);
  }
  switch (s.view) {
    case "idle": return drawIdle(s);
    case "scan": return drawScan(s);
    case "result": return drawResult(s);
    case "admin": return drawAdmin(s);
    case "teams": return drawTeams(s);
    case "menu": return h("div.page.scroll", {}, drawBlocks(s.lines, { error: s.tone === "error" }));
    case "board": return drawBoard(s);
  }
  if (s.person) return drawPerson(s);
  return h("div.page.scroll", {}, drawBlocks(s.lines, { error: s.tone === "error", mono: true }));
}

// People as rows: a rank or avatar, the name, their ID and team, and time.
function personRows(rows, opts = {}) {
  return h(`div.prows${opts.compact ? ".compact" : ""}`, { style: `--cols: ${opts.cols || 1}` }, rows.map(r => {
    const kids = [
      "rank" in r ? h(`span.rank${r.rank && r.rank <= 3 ? ".r" + r.rank : ""}`, {}, r.rank ? String(r.rank) : "–") : null,
      h("span.av", { style: `background: ${teamColor(r.team)}` }, (r.name || "?")[0]),
      h("div.nm", {}, r.name, h("div", {}, r.sub)),
      r.right ? h("span.tm", {}, r.right) : null,
      r.key ? icon("chev", 20, "#64748b") : null];
    return r.key ? h("button.prow", { on: () => sendKey(r.key) }, kids) : h("div.prow", {}, kids);
  }));
}
// The whole leaderboard (or the people a search found), with Search on top.
function drawBoard(s) {
  const bl = blocks(s.lines);
  const texts = bl.filter(b => b.text !== undefined).map(b => b.text);
  const acts = bl.filter(b => b.acts).flatMap(b => b.acts);
  return h("div.page", { style: "padding-bottom: 0" },
    h("div.boardtop", {}, h("p.text", {}, texts[0] || ""),
      acts.map(([k, label]) => h(`button.btn.press${k === "?" ? ".primary" : ""}`, { on: () => sendKey(keyFor(k)), style: "--go: var(--info)" },
                                 keyIcon(k, {}), label))),
    h("div.scroll", { style: "flex: 1; min-height: 0; padding-bottom: 20px" },
      s.rows.length ? personRows(s.rows) : h("div.empty", {}, "Nobody by that name")));
}
// Someone's page (admin): who they are, their hours, and what can be changed.
function drawPerson(s) {
  const p = s.person, bl = blocks(s.lines);
  const err = s.tone === "error" && bl[0] && bl[0].text !== undefined;
  return h("div.page.scroll", {},
    err ? textP(bl[0].text, ".err") : null,
    h("div.person", {}, h("span.av", { style: `background: ${teamColor(p.team)}` }, p.name[0] || "?"),
      h("div", { style: "flex: 1; min-width: 0" }, h("b", {}, p.name), h("span", {}, p.sub)),
      statCards(s.stats)),
    bl.filter(b => b.items).map(b => itemList(b.items, 2, false)));
}
// "Tap your card" -> "Tap your " + <em>card</em> (the last word in blue)
function accentLast(title) {
  const i = title.lastIndexOf(" ");
  return i > 0 ? [title.slice(0, i + 1), h("em", {}, title.slice(i + 1))] : [title];
}
function drawIdle(s) {
  const bl = blocks(s.lines);
  return h("div.hero.idle", {},
    h("div.bigclock", {}, h("b", { "data-clock": "time" }, clockText()), h("span", { "data-clock": "date" }, dateText())),
    h("h1", {}, ...accentLast(s.title)),
    bl.map(b => b.text !== undefined ? textP(b.text)
      : actButtons(b.acts, { icon: "pad", plain: true })));
}
function drawScan(s) {
  return h("div.hero", {}, h("h1", {}, s.title),
           drawBlocks(s.lines));
}
function drawResult(s) {
  const ic = { success: "check", error: "cross", warning: "warn" }[s.tone] || "check";
  return h("div.hero.result", {},
    h("div.ring.small", {}, icon(ic, 64, "var(--accent)", 3)),
    h("h1", {}, s.title), s.lines.map(l => textP(l)), statCards(s.stats));
}
function drawAdmin(s) {
  const bl = blocks(s.lines);
  const items = bl.filter(b => b.items).flatMap(b => b.items);
  const notes = bl.filter(b => b.text !== undefined && b.text.trim()).map(b => b.text);
  const look = [["people", "var(--info)"], ["clock", "var(--success)"], ["screen", "var(--warning)"]];
  return h("div.tiles", {}, items.map(([k, label], i) => {
    const [name, ...rest] = label.split(": ");
    const [ic, color] = look[i] || look[0];
    return h("button.tile", { on: () => sendKey(k) },
      h("span.ic", { style: `background: linear-gradient(140deg, color-mix(in srgb, ${color} 22%, transparent), color-mix(in srgb, ${color} 5%, transparent))` }, icon(ic, 30, color, 2.2)),
      h("b", {}, name), rest.length ? h("span", {}, rest.join(": ")) : null,
      i === items.length - 1 ? notes.map(n => h("span.pill", {}, n)) : null);
  }));
}
function drawTeams(s) {
  const bl = blocks(s.lines);
  const texts = bl.filter(b => b.text !== undefined && b.text.trim()).map(b => b.text);
  const cards = bl.filter(b => b.items).flatMap(b => b.items);
  const extra = bl.filter(b => b.acts).flatMap(b => b.acts);
  return h("div.page", {},
    texts.length ? h("div", {}, h("h1", {}, texts[0]), texts.slice(1).map(t => h("p.text", { style: "color: var(--muted); margin-top: 6px" }, t))) : null,
    h("div.teams", {},
      cards.map(([k, label]) => {
        const team = teamByName(label), [name, note] = label.split(/ {2}\(|\)$/);
        return h("button.team", { on: () => sendKey(k) },
          h("span.tl", { style: `background: ${teamColor(team ? team.letter : "")}` }),
          h("span", {}, name, note ? h("small", {}, note[0].toUpperCase() + note.slice(1)) : null));
      }),
      extra.map(([k, label]) => h("button.team.ghost", { on: () => sendKey(keyFor(k)) }, label))));
}
// Typing an ID: what's typed so far, the team buttons; the number pad is beside it.
function drawId(s) {
  const typed = (s.entry || "").replace(/_/g, ""), left = (s.entry || "").length - typed.length;
  const letter = /^[A-Z]/.test(typed) ? typed[0] : (typed ? "M" : "");
  const team = side && side.teams.find(t => t.letter === letter);
  const code = h("div.code", {}, typed, h("u", {}, "_".repeat(left)));
  const note = team ? `${team.name}\n${left} more digit${left === 1 ? "" : "s"}` : "Tap your team,\nthen your number";
  const keys = side ? side.keys : [];
  const bl = blocks(s.lines);
  return h("div.page", {},
    s.tone === "error" && bl[0] && bl[0].text ? textP(bl[0].text, ".err") : null,
    h("div.entry", {}, code, h("div.note", { style: "white-space: pre-line" }, note)),
    h("div.hint", {}, "Tap your team, then type your number"),
    h("div.tbtns", {}, keys.map(t => h(`button.tbtn${t.letter === letter ? ".on" : ""}`,
      { style: `--tc: ${teamColor(t.letter)}`, on: () => sendKey(t.key) },
      h("span.tl", { style: `background: ${teamColor(t.letter)}` }), t.name))),
    bl.filter(b => b.acts).map(b => h("div", { style: "margin-top: auto" }, actButtons(b.acts, { plain: true }))),
    side && side.mentors && !bl.some(b => b.acts) ? h("div.hint", { style: "margin-top: auto" },
      "Mentors and captains: just type your number.") : null);
}
// PINs (dots) and hour amounts (text), with the number pad beside.
function drawPin(s) {
  const entry = s.entry || "", dots = /^•*$/.test(entry);
  const bl = blocks(s.lines);
  const err = s.tone === "error" && bl[0] && bl[0].text !== undefined;
  const rest = err ? bl.slice(1) : bl;
  if (!dots) {   // an amount: "130  =  1h 30m"
    return h("div.page", {}, err ? textP(bl[0].text, ".err") : null,
      h("div.entry", {}, h("div.code", { style: "font-size: 44px; letter-spacing: .02em" }, entry)),
      rest.map(b => b.text !== undefined ? textP(b.text) : b.items ? itemList(b.items, 1) : actButtons(b.acts, { wide: true })));
  }
  const n = Math.max(entry.length, 4);
  return h("div.hero.pin", {},
    err ? textP(bl[0].text, ".err") : h("div.lockic", {}, icon("lock", 40, "var(--accent)", 2)),
    h("h1", { style: "font-size: 34px" }, s.title),
    h("div.dots", {}, Array.from({ length: n }, (_, i) => h(`i${i < entry.length ? ".on" : ""}`))),
    rest.map(b => b.text !== undefined ? textP(b.text) : actButtons(b.acts)));
}
// Names and Wi-Fi passwords: a field, with the keyboard along the bottom.
function drawTyping(s) {
  const bl = blocks(s.lines);
  const err = s.tone === "error" && bl[0] && bl[0].text !== undefined;
  const label = bl.filter(b => b.text !== undefined).map(b => b.text);
  const typed = (s.entry || "").replace(/_$/, "");
  const search = s.rows && (s.rows.length || /search|rank/i.test(s.title));
  if (search) {   // a name search: the field, then what it found, above the keyboard
    return h("div.page", { style: "justify-content: flex-start; gap: 10px; padding-top: 14px" },
      err ? textP(label.shift(), ".err") : null,
      h(`div.field${typed ? "" : ".empty"}`, {}, typed || "Type a name…"),
      s.rows.length ? personRows(s.rows, { cols: 2, compact: true }) : null,
      label.filter(t => t.trim()).map(t => h("p.text", { style: "font-size: 15px; color: var(--muted)" }, t)));
  }
  return h("div.page", { style: "justify-content: flex-start" },
    err ? textP(label.shift(), ".err") : null,
    label.map(t => h("p.text", { style: "font-size: 15px; color: var(--muted)" }, t)),
    h("div.field", {}, typed));
}
function drawDialog(s) {
  const p = s.person;
  const warn = s.tone === "warning" || s.tone === "error";
  // Red for actions that can't be undone (delete someone), amber for other warnings.
  const go = s.tone === "error" ? "var(--error)" : warn ? "var(--warning)" : "var(--info)";
  const bl = blocks(s.lines);
  const acts = bl.filter(b => b.acts).flatMap(b => b.acts);
  // Cancel first, the action last (where the thumb is).
  acts.sort((a, b) => (a[0] === "*") === (b[0] === "*") ? 0 : a[0] === "*" ? -1 : 1);
  return h("div.dialog", { role: "dialog", style: `--go: ${go}` },
    p ? h("div.person", {}, h("span.av", { style: `background: ${teamColor(p.team)}` }, p.name[0] || "?"),
          h("div", {}, h("b", {}, p.name), h("span", {}, p.sub))) : (warn ? h("div.warnic", {}, icon("warn", 28, "var(--accent)", 2.6)) : null),
    h("h2", {}, s.title),
    bl.filter(b => b.text !== undefined).map(b => textP(b.text)),
    statCards(s.stats),
    h("div.acts", {}, acts.map(([k, label]) => h(`button.btn.press${k === "#" ? ".primary" : ""}`,
      { on: () => sendKey(keyFor(k)) }, label))));
}

// A card tapped mid-menu (or a scheduled sign-out): a pop-up for 4 s, the menu stays.
function showToast(t) {
  playSound(t.sound);
  const color = t.tone === "error" ? "var(--error)" : t.tone === "warning" ? "var(--warning)"
    : t.person ? teamColor(t.person.team) : "var(--info)";
  const mark = t.person ? h("span.av", { style: `background: ${color}` }, t.person.name[0] || "?")
    : h("span.ti", { style: `background: color-mix(in srgb, ${color} 18%, transparent)` },
        icon(t.tone === "info" ? "timer" : "warn", 24, color, 2.6));
  const el = h("div.toast", { style: `--tc: ${color}` }, mark,
    h("div", { style: "min-width: 0" }, h("b", {}, t.title), t.lines.filter(l => l.trim()).map(l => h("span", { style: "display: block" }, l))));
  el.onclick = () => el.remove();
  const box = $("toasts");
  box.prepend(el);
  while (box.children.length > 3) box.lastElementChild.remove();
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 400); }, 4000);
}

// A result runs a bar down until the start screen comes back. undefined: carry on.
function holdBar(seconds) {
  if (seconds === undefined) return;
  const bar = $("hold"), fill = bar.firstElementChild;
  fill.getAnimations().forEach(a => a.cancel());
  bar.classList.toggle("on", !!seconds);
  if (seconds) fill.animate([{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }],
                            { duration: seconds * 1000, easing: "linear", fill: "forwards" });
}

// ---------------------------------------------------------------- number pad
const PAD = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "*", "0", "#"];
function drawPad(s) {
  // Adding hours uses its own Add / Subtract buttons, so Enter isn't needed there.
  const noGo = s.lines.some(l => (keyParts(l) || []).some(([k]) => k === "A"));
  const goLabel = s.keyboard === "id" ? "Go" : "OK";
  $("pad").style.setProperty("--go", s.keyboard === "numpad" ? "var(--prompt)" : "var(--info)");
  $("pad").replaceChildren(...PAD.map(k => {
    if (k === "*") return h("button", { "aria-label": "Delete", on: () => sendKey("*") }, icon("del", 30, null, 2.2));
    if (k === "#") return h(`button.go${noGo ? ".off" : ""}`, { on: () => sendKey("#") }, goLabel);
    return h("button", { on: () => sendKey(k) }, k);
  }));
}

// ---------------------------------------------------------------- letter keyboard
// "name" types people's names (the kiosk capitalises them). "text" is a full keyboard
// for Wi-Fi passwords: a one-shot Shift, and a 123 page of digits and symbols.
const KEYBOARDS = {
  name: [[..."QWERTYUIOP"], [..."ASDFGHJKL'"], [..."ZXCVBNM-."], ["Space", "Delete", "Done"]],
  letters: [[..."qwertyuiop"], ["", ..."asdfghjkl", ""], ["Shift", ..."zxcvbnm", "Delete"], ["123", "Space", "Done"]],
  symbols: [[..."1234567890"], [..."-/:;()$&@\""], [...".,?!'#%*+="], [..."_\\|~<>{}[]^`"], ["ABC", "Space", "Delete", "Done"]],
};
const WEIGHTS = { "": 1, Shift: 3, Delete: 3, "123": 3, ABC: 3, Done: 3, Space: 9 };
const CHARS = { Space: " ", Delete: "back", Done: "done" };
function drawKeys() {
  const rows = kbMode === "name" ? KEYBOARDS.name : KEYBOARDS[kbPage];
  $("kbd").replaceChildren(...rows.map(row => h("div", {}, row.map(key => {
    if (!key) return h("span", { style: "flex-grow: 1" });
    const b = h("button", { style: `flex-grow: ${WEIGHTS[key] || 2}`, on: () => pressKey(key) },
                kbShift && key.length === 1 ? key.toUpperCase() : key);
    if (key.length > 1) b.classList.add("word");
    if (key === "Done") b.classList.add("done");
    if (key === "Shift" && kbShift) b.classList.add("on");
    return b;
  }))));
}
function pressKey(key) {
  if (key === "Shift") kbShift = !kbShift;
  else if (key === "123" || key === "ABC") { kbPage = key === "123" ? "symbols" : "letters"; kbShift = false; }
  else {
    let char = CHARS[key] || key;
    if (kbMode === "name") char = char.toLowerCase();
    else if (kbShift && /^[a-z]$/.test(char)) { char = char.toUpperCase(); kbShift = false; drawKeys(); }
    return sendChar(char);
  }
  tapSound();
  drawKeys();
}

// ---------------------------------------------------------------- who's here / leaderboard
let tab = "here", listSig = null;
function renderSide() {
  if (!side) return;
  document.body.dataset.reader = side.reader_side || "left";
  $("tab-here").textContent = `Here now · ${side.here.length}`;
  $("tab-here").classList.toggle("on", tab === "here");
  $("tab-board").classList.toggle("on", tab === "board");
  $("tabs").classList.toggle("board", tab === "board");
  const rows = tab === "here" ? side.here : side.board;
  const sig = JSON.stringify([tab, rows.map(r => [r.rank, r.code, r.name])]);
  if (sig === listSig) {   // the same people: only the times move on
    rows.forEach((r, i) => { const t = $("list").children[i] && $("list").children[i].querySelector(".tm"); if (t) t.textContent = r.time; });
    return;
  }
  const before = new Set([...$("list").querySelectorAll(".row")].map(r => r.dataset.code));
  const sameTab = listSig && JSON.parse(listSig)[0] === tab;
  listSig = sig;
  if (!rows.length) {
    $("list").replaceChildren(h("div.empty", {}, tab === "here" ? "Nobody signed in yet" : "No hours yet"));
    return;
  }
  $("list").replaceChildren(...rows.map(r => {
    const row = h("div.row", { "data-code": r.code },
      tab === "board" ? h("span.rank", {}, String(r.rank)) : null,
      h("span.av", { style: `background: ${teamColor(r.letter)}` }, (r.name || "?")[0]),
      h("div.nm", {}, r.name, h("div", {}, `${r.code} · ${r.team}`)),
      h("span.tm", {}, r.time));
    if (tab === "here" && sameTab && !before.has(r.code)) row.classList.add("new");   // just signed in
    return row;
  }));
}
function selectTab(t) { if (t !== tab) { tab = t; tapSound(); renderSide(); $("list").scrollTop = 0; auto.since = performance.now(); } }

// A list longer than the panel scrolls by itself (20 px a second, resting 3 s at each
// end). Touching it pauses that for 20 s.
const auto = { phase: "top", since: 0, pos: 0, last: 0, pausedUntil: 0 };
function autoScroll(now) {
  requestAnimationFrame(autoScroll);
  const dt = Math.min(now - auto.last, 100) / 1000;
  auto.last = now;
  const box = $("list"), max = box.scrollHeight - box.clientHeight;
  if (max < 1 || now < auto.pausedUntil) { if (max < 1) Object.assign(auto, { phase: "top", since: now, pos: 0 }); return; }
  if (auto.pausedUntil) { auto.pausedUntil = 0; auto.pos = box.scrollTop; auto.phase = "down"; auto.since = now; }
  if (auto.phase === "top") { if (now - auto.since > 3000) auto.phase = "down"; }
  else if (auto.phase === "down") {
    auto.pos = Math.min(auto.pos + 20 * dt, max);
    box.scrollTop = auto.pos;
    if (auto.pos >= max) Object.assign(auto, { phase: "bottom", since: now });
  } else if (now - auto.since > 3000) { box.scrollTop = 0; Object.assign(auto, { phase: "top", since: now, pos: 0 }); }
}
requestAnimationFrame(autoScroll);
for (const type of ["pointerdown", "wheel"]) $("list").addEventListener(type, () => { auto.pausedUntil = performance.now() + 20000; }, { passive: true });

// ---------------------------------------------------------------- swipes
// Swiping in from the left edge goes back (like the arrow); swiping the side list
// sideways switches between Here now and Leaderboard.
let swipe = null;
document.addEventListener("pointerdown", e => { swipe = { x: e.clientX, y: e.clientY, edge: e.clientX < 28, side: !!e.target.closest("#side") }; });
document.addEventListener("pointerup", e => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = Math.abs(e.clientY - swipe.y);
  if (dy < 60 && Math.abs(dx) > 80) {
    if (swipe.edge && dx > 0 && $("bar").classList.contains("backable")) sendKey("X");
    else if (swipe.side) selectTab(dx < 0 ? "board" : "here");
  }
  swipe = null;
});

// ---------------------------------------------------------------- data, buttons, clock
async function loadSide() {
  try {
    const res = await fetch("/api/kiosk", { cache: "no-store" });
    if (!res.ok) return;
    const first = !side;
    side = await res.json();
    $("season").textContent = "Season " + side.season;
    $("sim").classList.toggle("on", side.simulated);
    $("update").classList.toggle("on", side.update);
    renderSide();
    if (first && shown && shown.view !== "dialog") showScreen({ ...shown, sound: null });   // team names and colours arrived
  } catch (e) { /* the event stream shows the offline notice */ }
}
$("back").onclick = () => sendKey("X");
$("lock").onclick = () => sendKey("X");
$("gear").onclick = () => sendKey("*");
$("tab-here").onclick = () => selectTab("here");
$("tab-board").onclick = () => selectTab("board");
$("sidemore").onclick = () => sendKey("~");
document.querySelectorAll("#rail button").forEach(b => { b.onclick = () => sendNav(b.dataset.nav); });
$("tap").onclick = () => post("/tap", { uid: $("uid").value });

// A computer (or USB) keyboard works too: digits, team keys, Enter, Backspace, Esc = back.
document.addEventListener("keydown", e => {
  if (e.target === $("uid")) { if (e.key === "Enter") $("tap").click(); return; }
  if (document.body.classList.contains("typing") && e.key !== "Escape") {
    const char = { Enter: "done", Backspace: "back" }[e.key] || (e.key.length === 1 ? e.key : "");
    if (char) { e.preventDefault(); sendChar(char); }
    return;
  }
  const key = { Enter: "#", Backspace: "*", Escape: "X" }[e.key] || e.key.toUpperCase();
  if (/^[0-9A-Z*#?~]$/.test(key)) { e.preventDefault(); sendKey(key); }
});
document.addEventListener("contextmenu", e => e.preventDefault());   // no long-press menu

function connect() {
  const events = new EventSource("/events");
  events.onopen = () => { $("offline").classList.remove("on"); loadSide(); };
  events.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === "screen") showScreen(msg.screen);
    if (msg.type === "toast") showToast(msg.toast);
    if (msg.type === "refresh") loadSide();
  };
  events.onerror = () => $("offline").classList.add("on");   // EventSource retries by itself
}
// The clock: in the top bar on every screen, and big on the start screen.
const clockText = () => new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const dateText = () => new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
function tick() {
  $("clock").textContent = clockText();
  document.querySelectorAll("[data-clock=time]").forEach(e => { e.textContent = clockText(); });
  document.querySelectorAll("[data-clock=date]").forEach(e => { e.textContent = dateText(); });
}
tick();
setInterval(tick, 1000);
setInterval(loadSide, 5000);
connect();
</script>
</body>
</html>
